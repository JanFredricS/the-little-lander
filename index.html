<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>The Little Lander</title>
    <meta name="description" content="A pixel-art physics side-scroller. Pilot a tiny lander through the shattered floating world of Aster: plant beacons, find the lost research team, escape the hollow. Plays in the browser, keyboard or touch." />
    <meta property="og:title" content="The Little Lander" />
    <meta property="og:description" content="Pilot a tiny lander through a shattered world. Plant beacons. Find the lost team. Get home." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b0d14" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* Size to the dynamic viewport (mobile toolbars): 100% fallback, dvh where supported. */
      html, body {
        margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #0b0d14; color: #d8dce8;
        font-family: ui-monospace, Menlo, monospace;
        touch-action: none; overscroll-behavior: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* The game box is the safe area; the scaler letterboxes the 640x360 view inside it.
         Explicit height over the DYNAMIC viewport (pineapple-run pattern: 100% fallback, then dvh) minus
         the top/bottom safe-area insets, so the box tracks iOS Safari's toolbar collapse under the
         over-height scroll body instead of relying on top+bottom inset sizing (no bottom offset:
         with top + height set it would be over-constrained). */
      #app {
        position: fixed; overflow: hidden; touch-action: none;
        top: max(env(safe-area-inset-top, 0px), 0px); right: env(safe-area-inset-right, 0px);
        left: env(safe-area-inset-left, 0px);
        height: calc(100% - max(env(safe-area-inset-top, 0px), 0px) - max(env(safe-area-inset-bottom, 0px), 0px));
        height: calc(100dvh - max(env(safe-area-inset-top, 0px), 0px) - max(env(safe-area-inset-bottom, 0px), 0px));
      }
      #app canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="max-width: 36em; margin: 3em auto; padding: 0 1em; line-height: 1.5">
        <b>The Little Lander</b> is a pixel-art physics game that runs in your browser.
        Pilot a tiny lander through the shattered world of Aster, plant beacons, find the
        lost research team and get home. It needs JavaScript (and WebGL) to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
